[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jpsync"
dynamic = ["version"]
description = "A git-like CLI to sync local folders with a remote JupyterHub via the Contents API."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pedro Gimenez", email = "pehqge@gmail.com" }]
maintainers = [{ name = "Pedro Gimenez", email = "pehqge@gmail.com" }]
keywords = ["jupyter", "jupyterhub", "cli", "sync", "contents-api", "notebook"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
jp = "jp.cli:main"

[project.urls]
Homepage = "https://github.com/pehqge/jpsync"
Repository = "https://github.com/pehqge/jpsync"
Issues = "https://github.com/pehqge/jpsync/issues"
Changelog = "https://github.com/pehqge/jpsync/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/jp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "W",   # pycodestyle warnings
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.mypy]
python_version = "3.9"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
