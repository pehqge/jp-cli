name: Release

on:
  # Primary automated path: release-please calls this as a reusable workflow in
  # the same run that creates the tag (a plain "push: tags" trigger never fires
  # for tags created by GITHUB_TOKEN, by GitHub's anti-recursion rule).
  workflow_call:
    inputs:
      tag_name:
        description: "Tag to release (e.g. v1.2.3). Defaults to the triggering ref."
        required: false
        type: string
  # Fallbacks: a human-pushed tag, or a manual run against an existing tag.
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-python:
    name: Build wheel, sdist and zipapp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Build zipapp
        run: python -m zipapp src -m "jp.cli:main" -p "/usr/bin/env python3" -o dist/jp.pyz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-dist
          path: dist/*

  build-binaries:
    name: Build ${{ matrix.name }} binary
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (arm64). Intel-mac binaries are intentionally
          # not built (the macos-13 runner queue is unreliable); Intel Macs can
          # still install via pip/pipx/uv or run the jp.pyz zipapp.
          - { os: macos-14, name: macos-arm64 }
          - { os: ubuntu-latest, name: linux-x86_64 }
          - { os: windows-latest, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: pyinstaller --onefile --name jp src/jp/__main__.py
      - name: Stage artifact (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staged
          cp dist/jp "staged/jp-${{ matrix.name }}"
      - name: Stage artifact (windows)
        if: runner.os == 'Windows'
        run: |
          mkdir staged
          copy dist\jp.exe staged\jp-${{ matrix.name }}.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.name }}
          path: staged/*

  github-release:
    name: Publish GitHub Release
    needs: [build-python, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      - name: Collect release assets and checksums
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' -o -name 'jp.pyz' -o -name 'jp-*' \) -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          # On workflow_call github.ref is the branch, not the tag, so the tag
          # must be passed in explicitly; push/dispatch fall back to the ref.
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: release/*
          # Keep release-please's grouped changelog as the body; don't let GitHub
          # append a second, duplicate "What's Changed" auto-notes section. The
          # AI highlights job prepends a concise summary on top.

  ai-release-notes:
    name: AI release highlights
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Check out the tag with full history so we can diff against the
          # previous tag (on workflow_call, github.ref is the branch).
          ref: ${{ inputs.tag_name || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Append AI-generated highlights (minor/major releases only)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass the tag via env (never inline ${{ }}) and validate its shape
          # before using it, per workflow-injection hardening.
          NEW_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$NEW_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$NEW_TAG' is not a vX.Y.Z release tag; skipping AI highlights."
            exit 0
          fi
          PREV_TAG="$(git describe --tags --abbrev=0 "${NEW_TAG}^" 2>/dev/null || echo '')"
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag; skipping AI highlights."
            exit 0
          fi
          python scripts/release_notes_ai.py "$PREV_TAG" "$NEW_TAG"

  publish-pypi:
    name: Publish to PyPI
    needs: build-python
    runs-on: ubuntu-latest
    # Only runs once you enable it: set repository variable PUBLISH_TO_PYPI=true
    # AND configure PyPI Trusted Publishing for this repo/workflow. Until then
    # this job is skipped, so a release never fails on a missing PyPI setup.
    if: vars.PUBLISH_TO_PYPI == 'true'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-dist
          path: dist
      - name: Drop non-PyPI artifacts
        run: rm -f dist/jp.pyz
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1 (v1.13.0)
        with:
          # When release-please calls this as a reusable workflow, OIDC auth
          # keys off job_workflow_ref (release.yml -> matches the PyPI Trusted
          # Publisher), but PEP 740 attestations are bound to the *entry*
          # workflow (release-please.yml), which the publisher doesn't match,
          # so the upload 400s. Disable attestations so the automated
          # release-please path publishes; OIDC still authorizes the upload.
          attestations: false
