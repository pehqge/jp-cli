name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release and upload assets
  id-token: write   # PyPI Trusted Publishing (OIDC), no API token needed

jobs:
  build-python:
    name: Build wheel, sdist and zipapp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(python -c 'import re,pathlib; t=pathlib.Path("src/jp/__init__.py").read_text(); print(re.search(r"__version__\s*=\s*\"([^\"]+)\"", t).group(1))')"
          echo "tag=$TAG package=$VER"
          test "$TAG" = "$VER" || { echo "::error::tag v$TAG != package version $VER"; exit 1; }
      - name: Build wheel + sdist
        run: |
          python -m pip install build
          python -m build
      - name: Build zipapp
        run: python -m zipapp src -m "jp.cli:main" -p "/usr/bin/env python3" -o dist/jp.pyz
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  build-binaries:
    name: Build ${{ matrix.name }} binary
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: macos-arm64 }
          - { os: macos-13, name: macos-x86_64 }
          - { os: ubuntu-latest, name: linux-x86_64 }
          - { os: windows-latest, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build one-file binary
        run: pyinstaller --onefile --name jp src/jp/__main__.py
      - name: Stage artifact (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staged
          cp dist/jp "staged/jp-${{ matrix.name }}"
      - name: Stage artifact (windows)
        if: runner.os == 'Windows'
        run: |
          mkdir staged
          copy dist\jp.exe staged\jp-${{ matrix.name }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: staged/*

  publish-pypi:
    name: Publish to PyPI (Trusted Publishing)
    needs: build-python
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: Drop non-PyPI artifacts
        run: rm -f dist/jp.pyz
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Publish GitHub Release
    needs: [build-python, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release assets + checksums
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' -o -name 'jp.pyz' -o -name 'jp-*' \) \
            -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
