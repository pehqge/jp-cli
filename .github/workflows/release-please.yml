name: release-please

# Maintains an always-open "release PR" that accumulates conventional-commit
# changes on main, bumping the version + CHANGELOG automatically. Merging that
# PR creates the vX.Y.Z tag and, in this same run, calls release.yml to build
# the artifacts + publish to PyPI. (A standalone "push: tags" trigger never
# fires for tags created by GITHUB_TOKEN, so the build is invoked directly via
# workflow_call instead.)

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  statuses: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Release PRs only bump the version + CHANGELOG, so the test matrix adds
      # no signal. The PR is opened by GITHUB_TOKEN, which (by design) never
      # triggers CI's pull_request run, so the required "CI success" check would
      # hang forever. Post that status directly from this run instead.
      - name: Mark "CI success" on the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          branch=$(jq -r .headBranchName <<<"$PR_JSON")
          sha=$(gh api "repos/$REPO/commits/$branch" --jq .sha)
          gh api -X POST "repos/$REPO/statuses/$sha" \
            -f state=success \
            -f context="CI success" \
            -f description="Skipped: release PR only bumps version + CHANGELOG"

  # When the release PR is merged, release-please cuts the tag + GitHub Release;
  # build the artifacts and publish to PyPI in the same run.
  release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
