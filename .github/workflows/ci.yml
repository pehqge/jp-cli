name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src
        continue-on-error: true

  test:
    name: Test ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests -q

  package:
    name: Packaging smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m zipapp src -m "jp.cli:main" -p "/usr/bin/env python3" -o jp.pyz
      - run: python jp.pyz version

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    # Advisory only: pip-audit surfaces known CVEs in the (dev-only) dependency
    # tree. The runtime install ships zero dependencies, so this scans pytest /
    # ruff / mypy and their transitive deps. Kept out of the required "CI
    # success" gate (like mypy above) so a freshly-disclosed CVE in a dev tool
    # never blocks unrelated PRs -- it shows up as a failed check to triage.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" pip-audit
      # --skip-editable excludes the project's own editable install. Otherwise
      # pip-audit looks up jpsync==<just-bumped version> on PyPI, which is not
      # published until release.yml runs afterwards, so --strict fails the
      # release-merge build with "Dependency not found on PyPI".
      - run: python -m pip_audit --strict --desc --skip-editable

  # Single required status check. Branch protection requires only this job,
  # so the test matrix can change without breaking protection or auto-merge.
  # Fails if any needed job failed or was cancelled.
  ci-success:
    name: CI success
    if: always()
    needs: [lint, test, package]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI jobs passed."
