<svg xmlns="http://www.w3.org/2000/svg" width="760" height="477" viewBox="0 0 760 477">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="760" height="477" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1" filter="url(#shadow)"/>
  <rect width="760" height="40" rx="12" fill="#161b22"/>
  <rect y="28" width="760" height="12" fill="#161b22"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="20" r="6" fill="#27c93f"/>
  <text x="380" y="25" text-anchor="middle" font-family="'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8b949e">jp — git-like JupyterHub sync</text>
  <line x1="0" y1="40" x2="760" y2="40" stroke="#30363d" stroke-width="1"/>
  <text x="26" y="78.5" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="14.5"><tspan fill="#3fb950">$ </tspan><tspan fill="#c9d1d9" font-weight="600">jp --help</tspan></text>
    
    <text x="26" y="124.5" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="14.5" fill="#8b949e">usage: jp [-h] [-q] [--no-color] [-V] &lt;command&gt; ...</text>
    
    <text x="26" y="170.5" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="14.5" fill="#c9d1d9">git-like safe sync between a local folder and a remote JupyterHub.</text>
    
    <text x="26" y="216.5" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="14.5" fill="#8b949e">commands:</text>
    <text x="26" y="239.5" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#79c0ff">  clone    </tspan><tspan fill="#8b949e">clone a remote Jupyter folder into a new local dir</tspan></text>
    <text x="26" y="262.5" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#79c0ff">  init     </tspan><tspan fill="#8b949e">initialize a .jp workspace in the current directory</tspan></text>
    <text x="26" y="285.5" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#79c0ff">  login    </tspan><tspan fill="#8b949e">save a named API-token credential</tspan></text>
    <text x="26" y="308.5" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#79c0ff">  pull     </tspan><tspan fill="#8b949e">download remote changes  (deletes are opt-in)</tspan></text>
    <text x="26" y="331.5" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#79c0ff">  push     </tspan><tspan fill="#8b949e">upload local changes     (deletes are opt-in)</tspan></text>
    <text x="26" y="354.5" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#79c0ff">  status   </tspan><tspan fill="#8b949e">show local/remote sync status (read-only)</tspan></text>
    <text x="26" y="377.5" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#79c0ff">  diff     </tspan><tspan fill="#8b949e">show unified diffs of changed files (read-only)</tspan></text>
    <text x="26" y="400.5" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#79c0ff">  rm       </tspan><tspan fill="#8b949e">delete a path on the remote (gated)</tspan></text>
    <text x="26" y="423.5" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#79c0ff">  terminal </tspan><tspan fill="#8b949e">open the remote machine's shell in this terminal</tspan></text>
    <text x="26" y="446.5" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#79c0ff">  doctor   </tspan><tspan fill="#8b949e">diagnose config, credentials and connectivity</tspan></text>
</svg>