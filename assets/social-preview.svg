      </g>

  <text x="90" y="588" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="24" fill="#8b949e">$ <tspan fill="#3fb950">pipx install</tspan> <tspan fill="#c9d1d9">jpsync</tspan></text>
  <text x="1194" y="588" text-anchor="end" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#30363d">github.com/pehqge/jpsync</text>
