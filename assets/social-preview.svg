  <text x="86" y="200" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="120" font-weight="700" fill="url(#title)">jpsync</text>
  <text x="92" y="262" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="34" fill="#c9d1d9">A git-like CLI to sync local folders with a remote JupyterHub</text>
  <text x="92" y="312" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="24" fill="#8b949e">Edit on your laptop · run on the remote GPUs · pull results back — no SSH needed</text>

